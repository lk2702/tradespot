name: Tägliches Update

on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Auswertung und Seite bauen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python lauf_cloud.py
      - name: Ergebnisse speichern
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "Tägliches Update"
          git push
